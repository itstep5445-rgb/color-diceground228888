<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Dice</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            min-height: 100vh; width: 100vw; overflow: hidden;
            background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
            background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center;
            padding: 20px; color: #fff; transition: background 0.4s ease;
        }
        #bgVideo { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; display: none; }

        /* Верхняя панель кнопок */
        .top-bar { position: fixed; top: 18px; right: 18px; display: flex; gap: 10px; z-index: 100; }
        .icon-btn {
            width: 46px; height: 46px; border-radius: 50%;
            background: rgba(15, 23, 42, 0.9); border: 2px solid rgba(255, 255, 255, 0.4);
            color: #fff; font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); transition: transform 0.2s;
        }
        .icon-btn:hover { transform: scale(1.08); }
        .palette-btn { background: linear-gradient(135deg, #ef4444, #3b82f6, #a855f7, #22c55e); }

        /* Перетаскиваемые окна */
        .popup-win {
            position: fixed; top: 76px; right: 20px; width: 280px; max-width: calc(100vw - 32px);
            background: rgba(15, 23, 42, 0.96); border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 18px; padding: 14px 16px 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.85);
            display: none; flex-direction: column; gap: 12px; z-index: 60;
        }
        .popup-win.open { display: flex; }
        .drag-head {
            display: flex; align-items: center; justify-content: space-between;
            cursor: grab; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.12);
            user-select: none; touch-action: none;
        }
        .drag-head:active { cursor: grabbing; }
        .win-title { font-size: 0.76rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; }
        .close-btn {
            background: rgba(255,255,255,0.12); border: none; color: #fff;
            width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 0.8rem;
        }
        .close-btn:hover { background: rgba(239, 68, 68, 0.5); }

        /* Главная карточка */
        .main-card {
            position: relative; z-index: 20; width: 100%; max-width: 550px;
            background: rgba(15, 23, 42, 0.86); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px; padding: 20px 28px 28px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8); text-align: center;
        }
        .main-drag { width: 100%; cursor: grab; padding-bottom: 8px; user-select: none; touch-action: none; }
        .main-drag:active { cursor: grabbing; }
        .pill { width: 44px; height: 5px; background: rgba(255,255,255,0.28); border-radius: 99px; margin: 0 auto 12px; }
        h1 { font-size: 2.3rem; font-weight: 800; margin-bottom: 4px; }
        .credit { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.14em; color: #94a3b8; margin-bottom: 18px; }
        .credit a { color: #38bdf8; text-decoration: none; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
        @media (max-width: 480px) { .grid-2 { grid-template-columns: 1fr; } }
        .ctrl { display: flex; flex-direction: column; text-align: left; gap: 6px; }
        .lbl { font-size: 0.72rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; }
        select {
            background: #1e293b; color: #fff; border: 1px solid rgba(255,255,255,0.22);
            border-radius: 12px; padding: 10px 12px; font-size: 0.88rem; font-weight: 600; cursor: pointer; width: 100%;
        }

        /* Кубики */
        .arena {
            min-height: 112px; display: flex; justify-content: center; align-items: center;
            flex-wrap: wrap; gap: 14px; margin: 16px 0; padding: 8px;
        }
        .dice {
            width: 78px; height: 78px; border-radius: 18px; border: 3px solid rgba(255,255,255,0.92);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 24px rgba(0,0,0,0.45);
            transition: background-color 0.07s linear;
            animation-duration: var(--dur, 0.42s); animation-fill-mode: both;
        }
        .dice-dot { width: 16px; height: 16px; background: #fff; border-radius: 50%; }
        .dice.rolling { animation: shake 0.12s infinite alternate ease-in-out; }
        @keyframes shake { 0% { transform: scale(0.95) rotate(-6deg); } 100% { transform: scale(1.05) rotate(6deg); } }

        .anim-bounce { animation-name: bounce; animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes bounce { 0% { transform: scale(0.55) rotate(-15deg); } 65% { transform: scale(1.14) rotate(4deg); } 100% { transform: scale(1) rotate(0); } }
        .anim-spin { animation-name: spin; }
        @keyframes spin { 0% { transform: scale(0.5) rotate(-360deg); } 100% { transform: scale(1) rotate(0); } }
        .anim-flip { animation-name: flip; }
        @keyframes flip { 0% { transform: perspective(400px) rotateY(180deg) scale(0.7); } 100% { transform: perspective(400px) rotateY(0) scale(1); } }
        .anim-drop { animation-name: drop; }
        @keyframes drop { 0% { transform: translateY(-35px) scale(0.85); } 100% { transform: translateY(0) scale(1); } }
        .anim-flash { animation-name: flash; }
        @keyframes flash { 0% { transform: scale(1.3); filter: brightness(2.2); } 100% { transform: scale(1); filter: brightness(1); } }

        #rollBtn {
            width: 100%; padding: 15px; font-size: 1.2rem; font-weight: 800; letter-spacing: 0.06em;
            color: #fff; background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: 1px solid rgba(255,255,255,0.25); border-radius: 16px; cursor: pointer;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.45); margin-bottom: 10px;
        }
        #rollBtn:active { transform: scale(0.98); }
        .speed-btn {
            padding: 11px; font-size: 0.88rem; font-weight: 700; color: #fff;
            background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 14px; cursor: pointer;
        }
        .speed-btn:hover { background: rgba(51, 65, 85, 0.95); }
        .active-mode { border-color: #38bdf8 !important; box-shadow: 0 0 15px rgba(56,189,248,0.5) !important; }

        /* История */
        .hist-list { max-height: 210px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .hist-item {
            background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px; padding: 7px 10px; font-size: 0.78rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .hist-dots { display: flex; gap: 5px; }
        .h-dot { width: 13px; height: 13px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.75); }
        .clear-btn {
            background: rgba(239,68,68,0.25); border: 1px solid rgba(239,68,68,0.45);
            color: #fca5a5; border-radius: 8px; padding: 7px; font-size: 0.76rem; font-weight: 700; cursor: pointer;
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <video id="bgVideo" autoplay loop muted playsinline></video>

    <div class="top-bar">
        <button type="button" class="icon-btn" id="resetPosBtn" title="Вернуть окна на место">🎯</button>
        <button type="button" class="icon-btn" id="histBtn" title="История бросков">📜</button>
        <button type="button" class="icon-btn" id="volBtn" title="Звук">🔊</button>
        <button type="button" class="icon-btn palette-btn" id="palBtn" title="Темы">🎨</button>
    </div>

    <!-- История бросков -->
    <div class="popup-win" id="histWin" style="right: 130px;">
        <div class="drag-head" data-drag="histWin">
            <span class="win-title">⋮⋮ 📜 История бросков</span>
            <button type="button" class="close-btn" data-close="histWin">✕</button>
        </div>
        <div class="hist-list" id="histList">
            <div style="color:#94a3b8;font-size:0.8rem;text-align:center;padding:10px;">Бросков еще не было</div>
        </div>
        <button type="button" class="clear-btn" id="clearHistBtn">Очистить историю</button>
    </div>

    <!-- Звук -->
    <div class="popup-win" id="volWin" style="right: 74px;">
        <div class="drag-head" data-drag="volWin">
            <span class="win-title">⋮⋮ 🔊 Звук</span>
            <button type="button" class="close-btn" data-close="volWin">✕</button>
        </div>
        <span class="lbl">Громкость</span>
        <input type="range" id="volRange" min="0" max="1" step="0.05" value="0.7">
        <span class="lbl">Мелодия броска</span>
        <select id="soundSel">
            <option value="bubble" selected>🫧 Бабл-гам</option>
            <option value="dice">🎲 Классические кубики</option>
            <option value="roulette">🎰 Рулетка</option>
            <option value="magic">✨ Магия</option>
            <option value="retro">👾 8-бит</option>
            <option value="mute">🔇 Без звука</option>
            <option value="upload_sound">📁 Загрузить свой звук...</option>
        </select>
    </div>

    <!-- Темы -->
    <div class="popup-win" id="palWin" style="right: 18px;">
        <div class="drag-head" data-drag="palWin">
            <span class="win-title">⋮⋮ 🎨 Темы и фон</span>
            <button type="button" class="close-btn" data-close="palWin">✕</button>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;background:#1e293b;padding:8px 12px;border-radius:12px;">
            <span style="font-size:0.82rem;font-weight:600;">Свой оттенок</span>
            <input type="color" id="colorPick" value="#6366f1" style="border:none;background:none;cursor:pointer;">
        </div>
        <span class="lbl">Готовая тема</span>
        <select id="themeSel">
            <option value="space" selected>🌌 Космос</option>
            <option value="cyber">⚡ Киберпанк</option>
            <option value="neon">🟢 Изумруд</option>
            <option value="sunset">🌅 Закат</option>
            <option value="fire">🔥 Огонь</option>
            <option value="upload_img">🖼️ Загрузить фото...</option>
            <option value="upload_vid">🎬 Загрузить видео...</option>
        </select>
    </div>

    <input type="file" id="soundFile" accept="audio/*">
    <input type="file" id="imgFile" accept="image/*">
    <input type="file" id="vidFile" accept="video/*">

    <!-- Главная карточка -->
    <div class="main-card" id="mainCard">
        <div class="main-drag" data-drag="mainCard" title="Потяните, чтобы двигать">
            <div class="pill"></div>
            <h1>🎲 Color Dice</h1>
            <div class="credit">MADE BY <a href="https://www.tiktok.com/@groundoffc" target="_blank">GROUND</a></div>
        </div>

        <div class="grid-2">
            <div class="ctrl">
                <span class="lbl">🎲 Кубиков</span>
                <select id="countSel">
                    <option value="1">1 кубик</option>
                    <option value="2">2 кубика</option>
                    <option value="3" selected>3 кубика</option>
                    <option value="4">4 кубика</option>
                    <option value="5">5 кубиков</option>
                    <option value="6">6 кубиков</option>
                </select>
            </div>
            <div class="ctrl">
                <span class="lbl">✨ Анимация</span>
                <select id="animSel">
                    <option value="bounce" selected>🏀 Пружинка</option>
                    <option value="spin">🌀 Поворот 360°</option>
                    <option value="flip">🃏 Переворот 3D</option>
                    <option value="drop">⬇️ Падение</option>
                    <option value="flash">⚡ Вспышка</option>
                </select>
            </div>
        </div>

        <div id="arena" class="arena"></div>

        <button type="button" id="rollBtn">БРОСИТЬ !</button>
        <div class="grid-2" style="margin-bottom:0;">
            <button type="button" id="fastBtn" class="speed-btn">⚡ Быстрый ролл</button>
            <button type="button" id="slowBtn" class="speed-btn">🐢 Медленный ролл</button>
        </div>
    </div>

    <script>
        const colors = [
            { name: 'КРАСНЫЙ', hex: '#ef4444' },
            { name: 'ОРАНЖЕВЫЙ', hex: '#f97316' },
            { name: 'ЖЕЛТЫЙ', hex: '#eab308' },
            { name: 'ЗЕЛЕНЫЙ', hex: '#22c55e' },
            { name: 'СИНИЙ', hex: '#3b82f6' },
            { name: 'ФИОЛЕТОВЫЙ', hex: '#a855f7' }
        ];

        const arena = document.getElementById('arena');
        const countSel = document.getElementById('countSel');
        const animSel = document.getElementById('animSel');
        const soundSel = document.getElementById('soundSel');
        const themeSel = document.getElementById('themeSel');
        const volRange = document.getElementById('volRange');
        const rollBtn = document.getElementById('rollBtn');
        const fastBtn = document.getElementById('fastBtn');
        const slowBtn = document.getElementById('slowBtn');
        const histList = document.getElementById('histList');
        const bgVideo = document.getElementById('bgVideo');

        let timers = [], intervals = [], rollId = 0, history = [], zTop = 70;
        let audioCtx = null, customAudio = null, lastSound = 'bubble', lastTheme = 'space';

        // Перетаскивание окон
        document.querySelectorAll('[data-drag]').forEach(handle => {
            const box = document.getElementById(handle.dataset.drag);
            let drag = false, sx = 0, sy = 0, ox = 0, oy = 0;

            const start = (x, y) => {
                drag = true;
                if (box.id !== 'mainCard') box.style.zIndex = ++zTop;
                const r = box.getBoundingClientRect();
                box.style.position = 'fixed';
                box.style.margin = '0';
                box.style.left = r.left + 'px';
                box.style.top = r.top + 'px';
                box.style.right = 'auto';
                sx = x; sy = y; ox = r.left; oy = r.top;
            };
            const move = (x, y) => {
                if (!drag) return;
                box.style.left = Math.max(-box.offsetWidth + 60, Math.min(ox + x - sx, window.innerWidth - 60)) + 'px';
                box.style.top = Math.max(0, Math.min(oy + y - sy, window.innerHeight - 50)) + 'px';
            };
            const end = () => { drag = false; };

            handle.addEventListener('mousedown', e => {
                if (e.target.closest('button, a, input, select')) return;
                e.preventDefault(); start(e.clientX, e.clientY);
            });
            window.addEventListener('mousemove', e => move(e.clientX, e.clientY));
            window.addEventListener('mouseup', end);

            handle.addEventListener('touchstart', e => {
                if (e.target.closest('button, a, input, select')) return;
                start(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
            window.addEventListener('touchmove', e => { if (drag) move(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
            window.addEventListener('touchend', end);
        });

        // Кнопки окон и сброса позиций
        const toggleWin = id => {
            const w = document.getElementById(id);
            w.classList.toggle('open');
            if (w.classList.contains('open')) w.style.zIndex = ++zTop;
        };
        document.getElementById('histBtn').onclick = () => toggleWin('histWin');
        document.getElementById('volBtn').onclick = () => toggleWin('volWin');
        document.getElementById('palBtn').onclick = () => toggleWin('palWin');
        document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => document.getElementById(b.dataset.close).classList.remove('open'));

        document.getElementById('resetPosBtn').onclick = () => {
            const mc = document.getElementById('mainCard');
            mc.style.position = 'relative'; mc.style.left = ''; mc.style.top = '';
            ['histWin', 'volWin', 'palWin'].forEach((id, i) => {
                const w = document.getElementById(id);
                w.style.left = 'auto'; w.style.top = '76px'; w.style.right = (130 - i * 56) + 'px';
            });
        };

        // История
        document.getElementById('clearHistBtn').onclick = () => { history = []; renderHist(); };
        function addHist(dice, mode) {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const icon = mode === 'fast' ? '⚡' : mode === 'slow' ? '🐢' : '🎲';
            history.unshift({ time, dice, icon });
            if (history.length > 20) history.length = 20;
            renderHist();
        }
        function renderHist() {
            if (!history.length) {
                histList.innerHTML = '<div style="color:#94a3b8;font-size:0.8rem;text-align:center;padding:10px;">Бросков еще не было</div>';
                return;
            }
            histList.innerHTML = history.map(h => `
                <div class="hist-item">
                    <div class="hist-dots">${h.dice.map(d => `<div class="h-dot" style="background:${d.hex}" title="${d.name}"></div>`).join('')}</div>
                    <span style="color:#94a3b8;font-size:0.74rem;">${h.icon} ${h.time}</span>
                </div>
            `).join('');
        }

        // Звук
        function playTone(freq, dur, type = 'sine', delay = 0) {
            const s = soundSel.value;
            if (s === 'mute' || s === 'upload_sound') return;
            const vol = parseFloat(volRange.value);
            if (vol <= 0) return;

            if (s === 'custom' && customAudio) {
                customAudio.currentTime = 0; customAudio.volume = vol; customAudio.play().catch(()=>{});
                return;
            }
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime + delay;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.22 * vol, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + dur + 0.01);
        }

        function playEffect(step = false) {
            const s = soundSel.value;
            if (s === 'bubble') playTone(step ? 520 : 420, 0.12, 'sine');
            else if (s === 'dice') playTone(step ? 240 : 190, 0.09, 'triangle');
            else if (s === 'roulette') playTone(820, 0.04, 'sine');
            else if (s === 'magic') { playTone(659, 0.18, 'sine'); if (!step) playTone(987, 0.22, 'sine', 0.07); }
            else if (s === 'retro') playTone(step ? 523 : 392, 0.08, 'square');
            else if (s === 'custom') playTone(440, 0.2);
        }

        // Роллы
        function randColor(except) {
            const pool = except ? colors.filter(c => c.hex !== except) : colors;
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function finishDice(el, col, dur) {
            el.classList.remove('rolling');
            el.style.backgroundColor = col.hex;
            el.style.setProperty('--dur', dur + 's');
            void el.offsetWidth;
            el.classList.add('anim-' + animSel.value, 'locked');
        }

        function roll(sound = true, mode = 'normal', save = true) {
            timers.forEach(clearTimeout); timers = [];
            intervals.forEach(clearInterval); intervals = [];
            [rollBtn, fastBtn, slowBtn].forEach(b => b.classList.remove('active-mode'));

            const id = ++rollId;
            const count = parseInt(countSel.value, 10);
            const final = Array.from({ length: count }, () => randColor());
            arena.innerHTML = '';

            const els = final.map(() => {
                const d = document.createElement('div');
                d.className = 'dice';
                d.style.backgroundColor = randColor().hex;
                d.innerHTML = '<div class="dice-dot"></div>';
                arena.appendChild(d);
                return d;
            });

            if (mode === 'fast') {
                fastBtn.classList.add('active-mode');
                if (sound) playEffect(false);
                els.forEach((el, i) => finishDice(el, final[i], 0.16));
                timers.push(setTimeout(() => { if (id === rollId) fastBtn.classList.remove('active-mode'); }, 220));
                if (save) addHist(final, 'fast');
                return;
            }

            els.forEach(el => el.classList.add('rolling'));

            if (mode === 'normal') {
                rollBtn.classList.add('active-mode');
                let prev = null;
                const shuf = setInterval(() => {
                    if (id !== rollId) return;
                    els.forEach(el => {
                        if (!el.classList.contains('locked')) {
                            const c = randColor(prev); prev = c.hex; el.style.backgroundColor = c.hex;
                        }
                    });
                    if (sound) playTone(600, 0.03, 'sine');
                }, 65);
                intervals.push(shuf);

                els.forEach((el, i) => {
                    timers.push(setTimeout(() => {
                        if (id !== rollId) return;
                        if (i === 0 && sound) playEffect(false);
                        finishDice(el, final[i], 0.42);
                        if (i === count - 1) {
                            clearInterval(shuf);
                            rollBtn.classList.remove('active-mode');
                            if (save) addHist(final, 'normal');
                        }
                    }, 300 + i * 75));
                });
                return;
            }

            if (mode === 'slow') {
                slowBtn.classList.add('active-mode');
                const shuf = setInterval(() => {
                    if (id !== rollId) return;
                    els.forEach(el => { if (!el.classList.contains('locked')) el.style.backgroundColor = randColor().hex; });
                }, 95);
                intervals.push(shuf);

                els.forEach((el, i) => {
                    const stopAt = 500 + i * 600;
                    [stopAt - 220, stopAt - 110].forEach(t => {
                        timers.push(setTimeout(() => {
                            if (id !== rollId) return;
                            el.style.backgroundColor = randColor().hex;
                            if (sound) playTone(520, 0.03, 'sine');
                        }, t));
                    });
                    timers.push(setTimeout(() => {
                        if (id !== rollId) return;
                        if (sound) playEffect(true);
                        finishDice(el, final[i], 0.55);
                        if (i === count - 1) {
                            clearInterval(shuf);
                            slowBtn.classList.remove('active-mode');
                            if (save) addHist(final, 'slow');
                        }
                    }, stopAt));
                });
            }
        }

        rollBtn.onclick = () => roll(true, 'normal', true);
        fastBtn.onclick = () => roll(true, 'fast', true);
        slowBtn.onclick = () => roll(true, 'slow', true);
        countSel.onchange = () => roll(true, 'fast', false);
        animSel.onchange = () => roll(true, 'fast', false);

        document.addEventListener('keydown', e => {
            if (e.code === 'Space' && !['BUTTON','SELECT','INPUT'].includes(document.activeElement.tagName)) {
                e.preventDefault(); roll(true, 'normal', true);
            }
        });

        // Темы и файлы
        document.getElementById('colorPick').oninput = e => {
            bgVideo.style.display = 'none';
            document.body.style.background = `radial-gradient(circle at center, ${e.target.value}55 0%, #05070b 100%)`;
            rollBtn.style.background = `linear-gradient(135deg, ${e.target.value}, #0f172a)`;
        };

        themeSel.onchange = e => {
            const v = e.target.value;
            if (v === 'upload_img') { themeSel.value = lastTheme; document.getElementById('imgFile').click(); return; }
            if (v === 'upload_vid') { themeSel.value = lastTheme; document.getElementById('vidFile').click(); return; }
            lastTheme = v; bgVideo.style.display = 'none';
            const map = {
                space: ['radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%)', 'linear-gradient(135deg, #6366f1, #4f46e5)'],
                cyber: ['linear-gradient(135deg, #09090b 0%, #3b0764 50%, #831843 100%)', 'linear-gradient(135deg, #a855f7, #7e22ce)'],
                neon:  ['linear-gradient(135deg, #022c22 0%, #064e3b 50%, #022f26 100%)', 'linear-gradient(135deg, #10b981, #059669)'],
                sunset:['linear-gradient(180deg, #2e1065 0%, #701a75 50%, #9a3412 100%)', 'linear-gradient(135deg, #ea580c, #c2410c)'],
                fire:  ['linear-gradient(135deg, #450a0a 0%, #c2410c 50%, #7c2d12 100%)', 'linear-gradient(135deg, #ef4444, #b91c1c)']
            };
            if (map[v]) { document.body.style.background = map[v][0]; rollBtn.style.background = map[v][1]; }
        };

        soundSel.onchange = e => {
            if (e.target.value === 'upload_sound') { soundSel.value = lastSound; document.getElementById('soundFile').click(); }
            else { lastSound = e.target.value; playEffect(false); }
        };

        document.getElementById('soundFile').onchange = e => {
            const f = e.target.files[0]; if (!f) return;
            customAudio = new Audio(URL.createObjectURL(f));
            let opt = document.getElementById('custSndOpt');
            if (!opt) { opt = document.createElement('option'); opt.id = 'custSndOpt'; opt.value = 'custom'; soundSel.prepend(opt); }
            opt.textContent = '🎵 ' + f.name.slice(0, 16);
            soundSel.value = 'custom'; lastSound = 'custom'; playEffect(false);
        };

        document.getElementById('imgFile').onchange = e => {
            const f = e.target.files[0]; if (!f) return;
            bgVideo.style.display = 'none';
            document.body.style.background = `url('${URL.createObjectURL(f)}') center/cover no-repeat fixed`;
        };

        document.getElementById('vidFile').onchange = e => {
            const f = e.target.files[0]; if (!f) return;
            bgVideo.src = URL.createObjectURL(f); bgVideo.style.display = 'block';
        };

        roll(false, 'fast', false);
    </script>
</body>
</html>
