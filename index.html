<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Dice</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #ffffff;
        }

        #bgVideo {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            display: none;
        }

        .main-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 580px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }

        .controls-grid {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .styled-select {
            background-color: rgba(15, 23, 42, 0.8);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            outline: none;
        }

        .dice-arena {
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            padding: 10px;
        }

        .dice {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            border: 3px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            position: relative;
            user-select: none;
        }

        .dice-dot {
            width: 16px;
            height: 16px;
            background-color: #ffffff;
            border-radius: 50%;
        }

        .dice.rolling {
            animation: diceAnim 0.35s ease;
        }

        @keyframes diceAnim {
            0% { transform: scale(0.5) rotate(-30deg); opacity: 0.3; }
            70% { transform: scale(1.1) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        #rollBtn {
            width: 100%;
            padding: 16px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
            margin-bottom: 20px;
            transition: filter 0.2s;
        }

        #rollBtn:hover {
            filter: brightness(1.1);
        }

        #rollBtn:active {
            transform: scale(0.98);
        }

        .audio-settings {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .volume-box {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 180px;
        }

        .volume-box span {
            font-size: 0.85rem;
            color: #cbd5e1;
            white-space: nowrap;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .tools-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 16px;
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            transition: background 0.2s;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        input[type="file"] {
            display: none;
        }

        .footer-credit {
            margin-top: 16px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #94a3b8;
        }

        .footer-credit span {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <video id="bgVideo" autoplay loop muted playsinline></video>

    <div class="main-card">
        <h1>Color Dice</h1>

        <div class="controls-grid">
            <select id="diceCountSelect" class="styled-select" aria-label="Количество кубиков">
                <option value="1">1 кубик</option>
                <option value="2">2 кубика</option>
                <option value="3" selected>3 кубика</option>
                <option value="4">4 кубика</option>
                <option value="5">5 кубиков</option>
                <option value="6">6 кубиков</option>
            </select>

            <select id="themeSelect" class="styled-select" aria-label="Тема оформления">
                <option value="space">🌌 Космос</option>
                <option value="cyber">⚡ Киберпанк</option>
                <option value="sunset">🌅 Закат</option>
            </select>
        </div>

        <div id="diceArena" class="dice-arena"></div>

        <button type="button" id="rollBtn">БРОСИТЬ !</button>

        <div class="audio-settings">
            <label class="tool-btn" style="margin:0; cursor:pointer;">
                🎵 Загрузить звук
                <input type="file" id="soundInput" accept="audio/*">
            </label>

            <div class="volume-box">
                <span>🔊 Громкость:</span>
                <input type="range" id="volumeRange" min="0" max="1" step="0.05" value="0.7">
            </div>
        </div>

        <div class="tools-bar">
            <label class="tool-btn">
                🖼️ Фото фона
                <input type="file" id="bgImageInput" accept="image/*">
            </label>

            <label class="tool-btn">
                🎬 Видео фона
                <input type="file" id="bgVideoInput" accept="video/*">
            </label>

            <button type="button" class="tool-btn" id="resetBgBtn">🔄 Сброс</button>
        </div>

        <div class="footer-credit">
            made by <span>Ground</span> (колордайс)
        </div>
    </div>

    <script>
        const diceColors = [
            { name: 'КРАСНЫЙ',    hex: '#ef4444' },
            { name: 'ОРАНЖЕВЫЙ',  hex: '#f97316' },
            { name: 'ЖЕЛТЫЙ',     hex: '#eab308' },
            { name: 'ЗЕЛЕНЫЙ',    hex: '#22c55e' },
            { name: 'СИНИЙ',      hex: '#3b82f6' },
            { name: 'ФИОЛЕТОВЫЙ', hex: '#a855f7' }
        ];

        const diceArena = document.getElementById('diceArena');
        const diceCountSelect = document.getElementById('diceCountSelect');
        const rollBtn = document.getElementById('rollBtn');
        const themeSelect = document.getElementById('themeSelect');
        const soundInput = document.getElementById('soundInput');
        const volumeRange = document.getElementById('volumeRange');

        const bgVideo = document.getElementById('bgVideo');
        const bgImageInput = document.getElementById('bgImageInput');
        const bgVideoInput = document.getElementById('bgVideoInput');
        const resetBgBtn = document.getElementById('resetBgBtn');

        let customAudio = null;
        let customAudioUrl = null;
        let bgObjectUrl = null;

        function playRollSound() {
            if (!customAudio) return;
            customAudio.currentTime = 0;
            customAudio.volume = parseFloat(volumeRange.value);
            customAudio.play().catch(() => {});
        }

        volumeRange.addEventListener('input', () => {
            if (customAudio) {
                customAudio.volume = parseFloat(volumeRange.value);
            }
        });

        function rollDice(withSound = true) {
            const count = parseInt(diceCountSelect.value, 10);
            diceArena.innerHTML = '';

            if (withSound) {
                playRollSound();
            }

            for (let i = 0; i < count; i++) {
                const randomColor = diceColors[Math.floor(Math.random() * diceColors.length)];
                const diceEl = document.createElement('div');
                diceEl.className = 'dice rolling';
                diceEl.style.backgroundColor = randomColor.hex;

                const dot = document.createElement('div');
                dot.className = 'dice-dot';
                diceEl.appendChild(dot);

                diceArena.appendChild(diceEl);
            }
        }

        rollBtn.addEventListener('click', () => rollDice(true));
        diceCountSelect.addEventListener('change', () => rollDice(true));

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !['BUTTON', 'SELECT', 'INPUT'].includes(document.activeElement.tagName)) {
                e.preventDefault();
                rollDice(true);
            }
        });

        themeSelect.addEventListener('change', (e) => {
            const theme = e.target.value;
            if (theme === 'space') {
                document.body.style.background = 'radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%)';
            } else if (theme === 'cyber') {
                document.body.style.background = 'linear-gradient(135deg, #09090b 0%, #3b0764 50%, #831843 100%)';
            } else if (theme === 'sunset') {
                document.body.style.background = 'linear-gradient(180deg, #2e1065 0%, #701a75 50%, #9a3412 100%)';
            }
        });

        soundInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (customAudioUrl) {
                URL.revokeObjectURL(customAudioUrl);
            }
            customAudioUrl = URL.createObjectURL(file);
            customAudio = new Audio(customAudioUrl);
            customAudio.volume = parseFloat(volumeRange.value);

            soundInput.parentElement.innerHTML = `🎵 ${file.name.slice(0, 12)}... <input type="file" id="soundInput" accept="audio/*">`;
            document.getElementById('soundInput').addEventListener('change', arguments.callee);
            playRollSound();
        });

        bgImageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (bgObjectUrl) URL.revokeObjectURL(bgObjectUrl);
            bgVideo.style.display = 'none';
            bgVideo.src = '';

            bgObjectUrl = URL.createObjectURL(file);
            document.body.style.backgroundImage = `url('${bgObjectUrl}')`;
        });

        bgVideoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (bgObjectUrl) URL.revokeObjectURL(bgObjectUrl);
            document.body.style.backgroundImage = '';

            bgObjectUrl = URL.createObjectURL(file);
            bgVideo.src = bgObjectUrl;
            bgVideo.style.display = 'block';
        });

        resetBgBtn.addEventListener('click', () => {
            if (bgObjectUrl) {
                URL.revokeObjectURL(bgObjectUrl);
                bgObjectUrl = null;
            }
            document.body.style.backgroundImage = '';
            bgVideo.style.display = 'none';
            bgVideo.src = '';
            bgImageInput.value = '';
            bgVideoInput.value = '';
            document.body.style.background = 'radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%)';
            themeSelect.value = 'space';
        });

        rollDice(false);
    </script>
</body>
</html>
