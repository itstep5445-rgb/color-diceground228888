<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Dice — Color Dice</title>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #090d16 100%);
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.22);
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --select-bg: rgba(15, 23, 42, 0.6);
            --select-border: rgba(255, 255, 255, 0.2);
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
        }

        /* Темы оформления */
        body.theme-space {
            --bg-gradient: radial-gradient(circle at 30% 20%, #0f172a 0%, #020617 100%);
            --card-bg: rgba(15, 23, 42, 0.7);
            --card-border: rgba(56, 189, 248, 0.3);
        }
        body.theme-cyber {
            --bg-gradient: linear-gradient(135deg, #09090b 0%, #3b0764 50%, #831843 100%);
            --card-bg: rgba(24, 24, 27, 0.75);
            --card-border: rgba(244, 63, 94, 0.35);
        }
        body.theme-sunset {
            --bg-gradient: linear-gradient(180deg, #2e1065 0%, #701a75 50%, #9a3412 100%);
            --card-bg: rgba(88, 28, 135, 0.5);
            --card-border: rgba(244, 114, 182, 0.3);
        }
        body.theme-emerald {
            --bg-gradient: linear-gradient(135deg, #022c22 0%, #064e3b 50%, #022f26 100%);
            --card-bg: rgba(6, 78, 59, 0.55);
            --card-border: rgba(52, 211, 153, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-color);
            transition: background 0.5s ease;
        }

        /* Звездный фон */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.7) 1px, transparent 1px);
            background-size: 45px 45px;
            opacity: 0.25;
            pointer-events: none;
            z-index: 0;
        }

        #bgVideo {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            display: none;
        }

        .main-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 640px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 36px 32px;
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 28px;
            background: linear-gradient(to right, #ffffff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 28px;
        }

        .styled-select {
            appearance: none;
            -webkit-appearance: none;
            background-color: var(--select-bg);
            color: var(--text-color);
            border: 1px solid var(--select-border);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .styled-select:hover {
            border-color: rgba(255, 255, 255, 0.4);
        }

        .dice-arena {
            min-height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 18px;
            margin-bottom: 32px;
            padding: 10px;
        }

        .dice {
            width: 86px;
            height: 86px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35), inset 0 2px 6px rgba(255, 255, 255, 0.4);
            position: relative;
            user-select: none;
        }

        .dice-dot {
            width: 18px;
            height: 18px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .dice.rolling {
            animation: diceAnimate 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes diceAnimate {
            0% { transform: scale(0.4) rotate(-40deg); opacity: 0.3; }
            70% { transform: scale(1.1) rotate(8deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        #rollBtn {
            width: 100%;
            padding: 16px;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: #ffffff;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: transform 0.15s ease, filter 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 24px;
        }

        #rollBtn:hover {
            filter: brightness(1.1);
            box-shadow: 0 14px 30px rgba(99, 102, 241, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        #rollBtn:active {
            transform: scale(0.98);
        }

        .audio-settings {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px 18px;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .volume-box {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 200px;
        }

        .volume-box span {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .tools-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 0.83rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, transform 0.1s;
            text-decoration: none;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: translateY(-1px);
        }

        input[type="file"] {
            display: none;
        }

        .footer-credit {
            margin-top: 18px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .footer-credit span {
            color: #38bdf8;
        }
    </style>
</head>
<body class="theme-space">

    <video id="bgVideo" autoplay loop muted playsinline></video>

    <div class="main-card">
        <h1>Color Dice</h1>

        <div class="controls-grid">
            <select id="diceCountSelect" class="styled-select" aria-label="Количество кубиков">
                <option value="1">1 кубик</option>
                <option value="2">2 кубика</option>
                <option value="3" selected>3 кубика</option>
                <option value="4">4 кубика</option>
                <option value="5">5 кубиков</option>
                <option value="6">6 кубиков</option>
            </select>

            <select id="themeSelect" class="styled-select" aria-label="Тема оформления">
                <option value="space">🌌 Тема: Космос</option>
                <option value="cyber">⚡ Тема: Киберпанк</option>
                <option value="sunset">🌅 Тема: Закат</option>
                <option value="emerald">🌲 Тема: Изумруд</option>
            </select>
        </div>

        <div id="diceArena" class="dice-arena"></div>

        <button type="button" id="rollBtn">БРОСИТЬ !</button>

        <div class="audio-settings">
            <label class="tool-btn" style="margin:0;">
                🎵 Загрузить свой звук
                <input type="file" id="soundInput" accept="audio/*">
            </label>

            <div class="volume-box">
                <span>🔊 Громкость:</span>
                <input type="range" id="volumeRange" min="0" max="1" step="0.05" value="0.7">
            </div>
        </div>

        <div class="tools-bar">
            <label class="tool-btn">
                🖼️ Фото на фон
                <input type="file" id="bgImageInput" accept="image/*">
            </label>

            <label class="tool-btn">
                🎬 Видео на фон
                <input type="file" id="bgVideoInput" accept="video/*">
            </label>

            <button type="button" class="tool-btn" id="resetBgBtn">🔄 Сброс фона</button>
        </div>

        <div class="footer-credit">
            made by <span>Ground</span> (колордайс)
        </div>
    </div>

    <script>
        const diceColors = [
            { name: 'КРАСНЫЙ',    hex: '#ef4444' },
            { name: 'ОРАНЖЕВЫЙ',  hex: '#f97316' },
            { name: 'ЖЕЛТЫЙ',     hex: '#eab308' },
            { name: 'ЗЕЛЕНЫЙ',    hex: '#22c55e' },
            { name: 'СИНИЙ',      hex: '#3b82f6' },
            { name: 'ФИОЛЕТОВЫЙ', hex: '#a855f7' }
        ];

        const diceArena = document.getElementById('diceArena');
        const diceCountSelect = document.getElementById('diceCountSelect');
        const rollBtn = document.getElementById('rollBtn');
        const themeSelect = document.getElementById('themeSelect');
        const soundInput = document.getElementById('soundInput');
        const volumeRange = document.getElementById('volumeRange');

        const bgVideo = document.getElementById('bgVideo');
        const bgImageInput = document.getElementById('bgImageInput');
        const bgVideoInput = document.getElementById('bgVideoInput');
        const resetBgBtn = document.getElementById('resetBgBtn');

        let customAudio = null;
        let customAudioUrl = null;
        let bgObjectUrl = null;

        function playRollSound() {
            if (!customAudio) return;
            customAudio.currentTime = 0;
            customAudio.volume = parseFloat(volumeRange.value);
            customAudio.play().catch(() => {});
        }

        volumeRange.addEventListener('input', () => {
            if (customAudio) {
                customAudio.volume = parseFloat(volumeRange.value);
            }
        });

        function rollDice(withSound = true) {
            const count = parseInt(diceCountSelect.value, 10);
            diceArena.innerHTML = '';

            if (withSound) {
                playRollSound();
            }

            for (let i = 0; i < count; i++) {
                const randomColor = diceColors[Math.floor(Math.random() * diceColors.length)];
                const diceEl = document.createElement('div');
                diceEl.className = 'dice rolling';
                diceEl.style.backgroundColor = randomColor.hex;
                diceEl.title = randomColor.name;

                const dot = document.createElement('div');
                dot.className = 'dice-dot';
                diceEl.appendChild(dot);

                diceArena.appendChild(diceEl);
            }
        }

        rollBtn.addEventListener('click', () => rollDice(true));
        diceCountSelect.addEventListener('change', () => rollDice(true));

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !['BUTTON', 'SELECT', 'INPUT'].includes(document.activeElement.tagName)) {
                e.preventDefault();
                rollDice(true);
            }
        });

        themeSelect.addEventListener('change', (e) => {
            document.body.className = `theme-${e.target.value}`;
        });

        soundInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (customAudioUrl) {
                URL.revokeObjectURL(customAudioUrl);
            }
            customAudioUrl = URL.createObjectURL(file);
            customAudio = new Audio(customAudioUrl);
            customAudio.volume = parseFloat(volumeRange.value);

            const shortName = file.name.length > 20 ? file.name.slice(0, 17) + '...' : file.name;
            soundInput.parentElement.innerHTML = `🎵 ${shortName} <input type="file" id="soundInput" accept="audio/*">`;
            
            document.getElementById('soundInput').addEventListener('change', arguments.callee);
            playRollSound();
        });

        bgImageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (bgObjectUrl) URL.revokeObjectURL(bgObjectUrl);
            bgVideo.style.display = 'none';
            bgVideo.src = '';

            bgObjectUrl = URL.createObjectURL(file);
            document.body.style.backgroundImage = `url('${bgObjectUrl}')`;
        });

        bgVideoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (bgObjectUrl) URL.revokeObjectURL(bgObjectUrl);
            document.body.style.backgroundImage = '';

            bgObjectUrl = URL.createObjectURL(file);
            bgVideo.src = bgObjectUrl;
            bgVideo.style.display = 'block';
        });

        resetBgBtn.addEventListener('click', () => {
            if (bgObjectUrl) {
                URL.revokeObjectURL(bgObjectUrl);
                bgObjectUrl = null;
            }
            document.body.style.backgroundImage = '';
            bgVideo.style.display = 'none';
            bgVideo.src = '';
            bgImageInput.value = '';
            bgVideoInput.value = '';
        });

        rollDice(false);
    </script>
</body>
</html>
