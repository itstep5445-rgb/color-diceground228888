<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Dice</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #ffffff;
            transition: background 0.5s ease;
        }

        #bgVideo {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            display: none;
        }

        .main-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 620px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 26px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            text-align: center;
        }

        h1 {
            font-size: 2.3rem;
            font-weight: bold;
            margin-bottom: 6px;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Авторство вверху */
        .top-credit {
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .top-credit span {
            color: #38bdf8;
        }

        /* Секции классификации */
        .settings-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            text-align: left;
            gap: 6px;
        }

        .control-label {
            font-size: 0.78rem;
            font-weight: bold;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .styled-select {
            background-color: rgba(30, 41, 59, 0.9);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            padding: 11px;
            font-size: 0.92rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            outline: none;
        }

        .styled-select:hover {
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* Арена кубиков */
        .dice-arena {
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin: 22px 0;
            padding: 10px;
        }

        .dice {
            width: 82px;
            height: 82px;
            border-radius: 18px;
            border: 3px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
            position: relative;
            user-select: none;
        }

        .dice-dot {
            width: 16px;
            height: 16px;
            background-color: #ffffff;
            border-radius: 50%;
        }

        .dice.rolling {
            animation: diceAnim 0.35s ease;
        }

        @keyframes diceAnim {
            0% { transform: scale(0.5) rotate(-35deg); opacity: 0.3; }
            70% { transform: scale(1.1) rotate(6deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        #rollBtn {
            width: 100%;
            padding: 16px;
            font-size: 1.35rem;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.45);
            margin-bottom: 20px;
            transition: filter 0.2s;
        }

        #rollBtn:hover {
            filter: brightness(1.1);
        }

        #rollBtn:active {
            transform: scale(0.98);
        }

        /* Панель звука и громкости */
        .audio-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 160px;
        }

        .volume-container span {
            font-size: 0.8rem;
            color: #cbd5e1;
            white-space: nowrap;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        /* Панель загрузки пользовательских медиа */
        .media-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 16px;
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            transition: background 0.2s;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <video id="bgVideo" autoplay loop muted playsinline></video>

    <div class="main-card">
        <h1>Color Dice</h1>
        <div class="top-credit">
            made by <span>Ground</span> (колордайс)
        </div>

        <!-- Классификация: Списки настроек (Кубики, Звук, Темы) -->
        <div class="settings-section">
            <div class="control-group">
                <span class="control-label">🎲 Количество кубиков</span>
                <select id="diceCountSelect" class="styled-select">
                    <option value="1">1 кубик</option>
                    <option value="2">2 кубика</option>
                    <option value="3" selected>3 кубика</option>
                    <option value="4">4 кубика</option>
                    <option value="5">5 кубиков</option>
                    <option value="6">6 кубиков</option>
                </select>
            </div>

            <div class="control-group">
                <span class="control-label">🎵 Звук броска</span>
                <select id="soundSelect" class="styled-select">
                    <option value="bubble" selected>🫧 Бабл-гам (Пузырьки)</option>
                    <option value="dice">🎲 Классические кубики</option>
                    <option value="roulette">🎰 Колесо фортуны</option>
                    <option value="magic">✨ Магия (Колокольчики)</option>
                    <option value="retro">👾 8-бит Аркада</option>
                    <option value="space">🛸 Космический лазер</option>
                    <option value="mute">🔇 Без звука</option>
                </select>
            </div>
        </div>

        <div class="control-group" style="margin-bottom: 22px;">
            <span class="control-label">🎨 Тема оформления и фон</span>
            <select id="themeSelect" class="styled-select">
                <option value="space">🌌 Космос (Глубокие звезды)</option>
                <option value="cyber">⚡ Киберпанк (Неоновый фиолет)</option>
                <option value="sunset">🌅 Закат (Пылающий градиент)</option>
                <option value="neon">🟢 Неоновая матрица (Темный изумруд)</option>
                <option value="saturn">🪐 Сатурн (Космическая планета)</option>
                <option value="forest">🌲 Лесная поляна (Глубокий мох)</option>
                <option value="neptune">🌊 Нептун (Океанский ультрамарин)</option>
            </select>
        </div>

        <div id="diceArena" class="dice-arena"></div>

        <button type="button" id="rollBtn">БРОСИТЬ !</button>

        <!-- Настройка громкости и загрузка своего звука -->
        <div class="audio-box">
            <label class="tool-btn" style="margin:0; cursor:pointer;">
                📁 Свой звук
                <input type="file" id="soundInput" accept="audio/*">
            </label>

            <div class="volume-container">
                <span>🔊 Громкость:</span>
                <input type="range" id="volumeRange" min="0" max="1" step="0.05" value="0.7">
            </div>
        </div>

        <!-- Загрузка своих фонов (фото/видео) -->
        <div class="media-bar">
            <label class="tool-btn">
                🖼️ Фото на фон
                <input type="file" id="bgImageInput" accept="image/*">
            </label>

            <label class="tool-btn">
                🎬 Видео на фон
                <input type="file" id="bgVideoInput" accept="video/*">
            </label>
        </div>
    </div>

    <script>
        const diceColors = [
            { name: 'КРАСНЫЙ',    hex: '#ef4444' },
            { name: 'ОРАНЖЕВЫЙ',  hex: '#f97316' },
            { name: 'ЖЕЛТЫЙ',     hex: '#eab308' },
            { name: 'ЗЕЛЕНЫЙ',    hex: '#22c55e' },
            { name: 'СИНИЙ',      hex: '#3b82f6' },
            { name: 'ФИОЛЕТОВЫЙ', hex: '#a855f7' }
        ];

        const diceArena = document.getElementById('diceArena');
        const diceCountSelect = document.getElementById('diceCountSelect');
        const soundSelect = document.getElementById('soundSelect');
        const rollBtn = document.getElementById('rollBtn');
        const themeSelect = document.getElementById('themeSelect');
        const soundInput = document.getElementById('soundInput');
        const volumeRange = document.getElementById('volumeRange');

        const bgVideo = document.getElementById('bgVideo');
        const bgImageInput = document.getElementById('bgImageInput');
        const bgVideoInput = document.getElementById('bgVideoInput');

        let customAudio = null;
        let customAudioUrl = null;
        let bgObjectUrl = null;
        let audioCtx = null;

        function playRollSound() {
            const soundType = soundSelect.value;
            if (soundType === 'mute') return;

            if (soundType === 'custom' && customAudio) {
                customAudio.currentTime = 0;
                customAudio.volume = parseFloat(volumeRange.value);
                customAudio.play().catch(() => {});
                return;
            }

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;
            const vol = parseFloat(volumeRange.value);

            if (soundType === 'bubble') {
                [0, 0.08, 0.16, 0.24].forEach((delay, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300 + idx * 140, now + delay);
                    osc.frequency.exponentialRampToValueAtTime(700 + idx * 160, now + delay + 0.07);

                    gain.gain.setValueAtTime(0.25 * vol, now + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.08);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + delay);
                    osc.stop(now + delay + 0.09);
                });
            } else if (soundType === 'dice') {
                [0, 0.07, 0.15, 0.24].forEach((delay, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(280 + idx * 65, now + delay);
                    osc.frequency.exponentialRampToValueAtTime(90, now + delay + 0.06);

                    gain.gain.setValueAtTime(0.3 * vol, now + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.06);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + delay);
                    osc.stop(now + delay + 0.065);
                });
            } else if (soundType === 'roulette') {
                for (let i = 0; i < 8; i++) {
                    const delay = i * 0.03;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now + delay);
                    gain.gain.setValueAtTime(0.2 * vol, now + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.025);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + delay);
                    osc.stop(now + delay + 0.03);
                }
            } else if (soundType === 'magic') {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const delay = idx * 0.06;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + delay);

                    gain.gain.setValueAtTime(0.18 * vol, now + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.3);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + delay);
                    osc.stop(now + delay + 0.32);
                });
            } else if (soundType === 'retro') {
                [261.63, 329.63, 392.00, 523.25].forEach((freq, idx) => {
                    const delay = idx * 0.05;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, now + delay);

                    gain.gain.setValueAtTime(0.1 * vol, now + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.06);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + delay);
                    osc.stop(now + delay + 0.065);
                });
            } else if (soundType === 'space') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.25);

                gain.gain.setValueAtTime(0.25 * vol, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.32);
            }
        }

        function rollDice(withSound = true) {
            const count = parseInt(diceCountSelect.value, 10);
            diceArena.innerHTML = '';

            if (withSound) {
                playRollSound();
            }

            for (let i = 0; i < count; i++) {
                const randomColor = diceColors[Math.floor(Math.random() * diceColors.length)];
                const diceEl = document.createElement('div');
                diceEl.className = 'dice rolling';
                diceEl.style.backgroundColor = randomColor.hex;

                const dot = document.createElement('div');
                dot.className = 'dice-dot';
                diceEl.appendChild(dot);

                diceArena.appendChild(diceEl);
            }
        }

        rollBtn.addEventListener('click', () => rollDice(true));
        diceCountSelect.addEventListener('change', () => rollDice(true));

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !['BUTTON', 'SELECT', 'INPUT'].includes(document.activeElement.tagName)) {
                e.preventDefault();
                rollDice(true);
            }
        });

        themeSelect.addEventListener('change', (e) => {
            if (bgObjectUrl) {
                URL.revokeObjectURL(bgObjectUrl);
                bgObjectUrl = null;
            }
            bgVideo.style.display = 'none';
            bgVideo.src = '';
            bgImageInput.value = '';
            bgVideoInput.value = '';

            applyTheme(e.target.value);
        });

        function applyTheme(theme) {
            if (theme === 'space') {
                document.body.style.background = 'radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%)';
            } else if (theme === 'cyber') {
                document.body.style.background = 'linear-gradient(135deg, #09090b 0%, #3b0764 50%, #831843 100%)';
            } else if (theme === 'sunset') {
                document.body.style.background = 'linear-gradient(180deg, #2e1065 0%, #701a75 50%, #9a3412 100%)';
            } else if (theme === 'neon') {
                document.body.style.background = 'linear-gradient(135deg, #022c22 0%, #064e3b 50%, #022f26 100%)';
            } else if (theme === 'saturn') {
                document.body.style.background = 'radial-gradient(ellipse at center, #fef08a 0%, #d97706 40%, #451a03 100%)';
            } else if (theme === 'forest') {
                document.body.style.background = 'linear-gradient(180deg, #052e16 0%, #15803d 60%, #166534 100%)';
            } else if (theme === 'neptune') {
                document.body.style.background = 'linear-gradient(135deg, #020617 0%, #1d4ed8 50%, #06b6d4 100%)';
            }
        }

        soundInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (customAudioUrl) {
                URL.revokeObjectURL(customAudioUrl);
            }
            customAudioUrl = URL.createObjectURL(file);
            customAudio = new Audio(customAudioUrl);
            customAudio.volume = parseFloat(volumeRange.value);

            let customOpt = document.getElementById('customSoundOption');
            if (!customOpt) {
                customOpt = document.createElement('option');
                customOpt.id = 'customSoundOption';
                customOpt.value = 'custom';
                soundSelect.insertBefore(customOpt, soundSelect.firstChild);
            }
            customOpt.textContent = `🎵 ${file.name.slice(0, 14)}...`;
            soundSelect.value = 'custom';
            playRollSound();
        });

        bgImageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (bgObjectUrl) URL.revokeObjectURL(bgObjectUrl);
            bgVideo.style.display = 'none';
            bgVideo.src = '';

            bgObjectUrl = URL.createObjectURL(file);
            document.body.style.backgroundImage = `url('${bgObjectUrl}')`;
        });

        bgVideoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (bgObjectUrl) URL.revokeObjectURL(bgObjectUrl);
            document.body.style.backgroundImage = '';

            bgObjectUrl = URL.createObjectURL(file);
            bgVideo.src = bgObjectUrl;
            bgVideo.style.display = 'block';
        });

        applyTheme('space');
        rollDice(false);
    </script>
</body>
</html>
