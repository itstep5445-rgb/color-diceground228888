<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Dice — Color Dice</title>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #090d16 100%);
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.22);
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --select-bg: rgba(15, 23, 42, 0.6);
            --select-border: rgba(255, 255, 255, 0.2);
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
        }

        /* Темы оформления */
        body.theme-space {
            --bg-gradient: radial-gradient(circle at 30% 20%, #0f172a 0%, #020617 100%);
            --card-bg: rgba(15, 23, 42, 0.7);
            --card-border: rgba(56, 189, 248, 0.3);
        }
        body.theme-cyber {
            --bg-gradient: linear-gradient(135deg, #09090b 0%, #3b0764 50%, #831843 100%);
            --card-bg: rgba(24, 24, 27, 0.75);
            --card-border: rgba(244, 63, 94, 0.35);
        }
        body.theme-sunset {
            --bg-gradient: linear-gradient(180deg, #2e1065 0%, #701a75 50%, #9a3412 100%);
            --card-bg: rgba(88, 28, 135, 0.5);
            --card-border: rgba(244, 114, 182, 0.3);
        }
        body.theme-emerald {
            --bg-gradient: linear-gradient(135deg, #022c22 0%, #064e3b 50%, #022f26 100%);
            --card-bg: rgba(6, 78, 59, 0.55);
            --card-border: rgba(52, 211, 153, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-color);
            transition: background 0.5s ease;
        }

        /* Звездный фон */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.7) 1px, transparent 1px);
            background-size: 45px 45px;
            opacity: 0.25;
            pointer-events: none;
            z-index: 0;
        }

        #bgVideo {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            display: none;
        }

        .main-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 640px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 36px 32px;
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 28px;
            background: linear-gradient(to right, #ffffff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Панель управления верха */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 28px;
        }

        .styled-select {
            appearance: none;
            -webkit-appearance: none;
            background-color: var(--select-bg);
            color: var(--text-color);
            border: 1px solid var(--select-border);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .styled-select:hover {
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Арена кубиков */
        .dice-arena {
            min-height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 18px;
            margin-bottom: 32px;
            padding: 10px;
        }

        .dice {
            width: 86px;
            height: 86px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35), inset 0 2px 6px rgba(255, 255, 255, 0.4);
            position: relative;
            user-select: none;
        }

        .dice-dot {
            width: 18px;
            height: 18px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .dice.rolling {
            animation: diceAnimate 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes diceAnimate {
            0% { transform: scale(0.4) rotate(-40deg); opacity: 0.3; }
            70% { transform: scale(1.1) rotate(8deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* Главная кнопка броска */
        #rollBtn {
            width: 100%;
            padding: 16px;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: #ffffff;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: transform 0.15s ease, filter 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 24px;
        }

            filter: brightness(1.1);
            box-shadow: 0 14px 30px rgba(99, 102, 241, 0
